<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototype — Navigator · P3R Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet" />
<style>
  /* ------------------------------------------------------------------
     Tokens. --scan is the game accent (P3R = blue): drive it off
     --p-primary-300; --hull/--panel become the surface ramp. --alert is
     the one warm colour and only ever means "weak". Layout idea: the
     result is read off a scanner, and a navigator says out loud what the
     scanner found. The copy is the personality: every readout has a
     sentence beside it in plain words.
     ------------------------------------------------------------------ */
  :root {
    --hull: #071a2e;
    --panel: #0d2742;
    --line: #1d4568;
    --ink: #e6f3ff;
    --dim: #9fb8cf;             /* 7.9:1 on --hull */
    --scan: #5cc8ff;            /* P3R blue, --p-primary-300 */
    --scan-ink: #04172b;
    --alert: #ffb547;           /* weak, and only weak */
    --alert-ink: #2a1700;
    --hud: 'Chakra Petch', system-ui, sans-serif;
    --voice: 'Nunito Sans', system-ui, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(60% 50% at 50% 30%, color-mix(in srgb, var(--scan) 10%, transparent), transparent 70%),
      var(--hull);
    color: var(--ink);
    font: 400 15px/1.55 var(--voice);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--scan); outline-offset: 2px; }

  /* ------------------------------------------------------------------ header */
  .bar {
    display: flex;
    align-items: center;
    gap: 2rem;
    padding: 0.85rem 2rem;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font: 700 1.35rem/1 var(--hud);
    text-decoration: none;
    white-space: nowrap;

    /* A tiny scope as the logo. */
    &::before {
      content: '';
      width: 1.1rem;
      height: 1.1rem;
      border-radius: 50%;
      border: 2px solid var(--scan);
      background: radial-gradient(circle, var(--scan) 0 2px, transparent 3px);
    }
  }
  .nav {
    display: flex;
    gap: 0.2rem;
    flex: 1;

    a {
      padding: 0.35rem 0.8rem;
      border-radius: 4px;
      font: 600 0.95rem/1.2 var(--hud);
      text-decoration: none;
      color: var(--dim);
      white-space: nowrap;

      &:hover { color: var(--ink); background: var(--panel); }
      &[aria-current='page'] { color: var(--scan-ink); background: var(--scan); }
    }
  }
  .bar__count { color: var(--dim); white-space: nowrap; font-size: 0.9rem; b { color: var(--ink); font-family: var(--hud); } }

  /* ------------------------------------------------------------------ layout */
  main { max-width: 1280px; margin: 0 auto; padding: 1.8rem 2rem 5rem; }
  .modebar {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    justify-content: space-between;
    gap: 1rem 2rem;
    margin-bottom: 1.6rem;

    h1 { margin: 0; font: 700 clamp(2.2rem, 4.5vw, 3.2rem)/1 var(--hud); }
    p { margin: 0.35rem 0 0; color: var(--dim); }
  }
  .modes {
    display: inline-flex;
    padding: 3px;
    gap: 3px;
    border: 1px solid var(--line);
    border-radius: 6px;

    button {
      font: 600 0.92rem/1 var(--hud);
      padding: 0.55rem 1rem;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;

      &:hover { color: var(--ink); background: var(--panel); }
      &:active { transform: translateY(1px); }
      &[aria-pressed='true'] { background: var(--scan); color: var(--scan-ink); }
    }
  }

  .console > *, .targets > * { min-width: 0; }
  .console {
    display: grid;
    grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr) minmax(0, 1fr);
    gap: 1.8rem;
    align-items: start;
  }
  .panel {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: color-mix(in srgb, var(--panel) 85%, transparent);
    padding: 0.95rem 1.1rem 1rem;
  }
  .panel h2, .panel h3 { margin: 0 0 0.5rem; font: 600 1rem/1.2 var(--hud); color: var(--dim); }

  /* ------------------------------------------------------------------ targets (parents) */
  .targets { display: grid; gap: 0.8rem; }
  .target { transition: border-color 0.15s; &:hover, &:focus-within { border-color: var(--scan); } }
  .slot {
    display: flex;
    align-items: center;
    gap: 0.5rem;

    label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    input {
      flex: 1;
      min-width: 0;
      width: 0;
      padding: 0.1rem 0;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--ink);
      font: 700 1.5rem/1.2 var(--hud);

      &:focus-visible { outline: none; border-bottom-color: var(--scan); }
    }
    button {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--dim);
      font: 600 0.75rem/1 var(--hud);
      padding: 0.35rem 0.55rem;
      cursor: pointer;

      &:hover { color: var(--ink); border-color: var(--dim); }
    }
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.1rem 1rem;
    margin: 0 0 0.55rem;
    font-size: 0.85rem;
    color: var(--dim);

    b { color: var(--ink); font-family: var(--hud); font-weight: 600; }
  }
  .skills {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
    gap: 0.1rem 1rem;
    font-size: 0.87rem;

    li { display: flex; justify-content: space-between; gap: 0.5rem; }
    .lv { color: var(--dim); font: 500 0.82rem/1.6 var(--hud); }
    .innate { font-weight: 700; }
  }

  /* ------------------------------------------------------------------ the scope */
  .scope-wrap { display: grid; justify-items: center; gap: 0.6rem; }
  .scope {
    position: relative;
    width: min(100%, 30rem);
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle, transparent 0 34%, color-mix(in srgb, var(--scan) 30%, transparent) 34% calc(34% + 1px), transparent calc(34% + 1px)),
      radial-gradient(circle, transparent 0 56%, color-mix(in srgb, var(--scan) 22%, transparent) 56% calc(56% + 1px), transparent calc(56% + 1px)),
      radial-gradient(circle, color-mix(in srgb, var(--panel) 90%, var(--scan)) 0 70%, transparent 70.4%);
    box-shadow: 0 0 0 1px var(--line), 0 0 60px -10px color-mix(in srgb, var(--scan) 40%, transparent);
  }
  /* Crosshair. */
  .scope::before, .scope::after {
    content: '';
    position: absolute;
    background: color-mix(in srgb, var(--scan) 18%, transparent);
  }
  .scope::before { left: 50%; top: 15%; bottom: 15%; width: 1px; }
  .scope::after { top: 50%; left: 15%; right: 15%; height: 1px; }

  /* The sweep: one turn on load, then it rests. */
  .sweep {
    position: absolute;
    inset: 15%;
    border-radius: 50%;
    pointer-events: none;
    background: conic-gradient(from -90deg, color-mix(in srgb, var(--scan) 55%, transparent), transparent 22%);
    opacity: 0;
  }
  .scope[data-scan='sweeping'] .sweep { opacity: 1; animation: sweep 1.8s linear forwards; }
  @keyframes sweep { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  .core {
    position: absolute;
    inset: 32%;
    display: grid;
    place-content: center;
    text-align: center;
    border-radius: 50%;

    p { margin: 0; color: var(--dim); font-size: 0.8rem; }
    h2 { margin: 0.1rem 0; font: 700 clamp(1.6rem, 3.2vw, 2.4rem)/1 var(--hud); }
    .core__lv { font: 600 0.95rem/1.2 var(--hud); color: var(--scan); }
  }

  /* Affinity markers on the orbit. Each is a button: hover or focus lights its line in the log. */
  .mk {
    --a: 0deg;
    position: absolute;
    left: 50%;
    top: 50%;
    display: grid;
    place-items: center;
    width: 3.2rem;
    height: 3.2rem;
    margin: -1.6rem 0 0 -1.6rem;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--hull);
    color: var(--ink);
    font: 600 0.72rem/1.05 var(--hud);
    cursor: pointer;
    /* Fallback orbit; the script sets the real radius from the scope's width. */
    transform: rotate(var(--a)) translateY(-13rem) rotate(calc(var(--a) * -1));
    transition: opacity 0.25s, transform 0.25s, border-color 0.15s, background 0.15s;

    b { display: block; font-size: 0.95rem; }
    &:hover, &:focus-visible, &.is-lit { border-color: var(--scan); background: var(--panel); }
    &.wk { background: var(--alert); border-color: var(--alert); color: var(--alert-ink); }
    &.rs, &.nu, &.rp, &.dr { border: 2px solid var(--ink); }
    &.n b { color: var(--dim); font-weight: 500; }
  }
  .scope[data-scan='sweeping'] .mk:not(.is-found) { opacity: 0; }
  .legend { margin: 0; font-size: 0.8rem; color: var(--dim); text-align: center; }

  /* ------------------------------------------------------------------ navigator log */
  .side { display: grid; gap: 1rem; }
  .log {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.55rem;

    li {
      position: relative;
      padding: 0.55rem 0.75rem 0.6rem 0.9rem;
      border-left: 3px solid var(--line);
      border-radius: 0 6px 6px 0;
      background: color-mix(in srgb, var(--hull) 60%, transparent);
      font-size: 0.95rem;
      transition: opacity 0.3s, transform 0.3s, border-color 0.15s, background 0.15s;
    }
    li.is-alert { border-left-color: var(--alert); }
    li.is-lit { border-left-color: var(--scan); background: color-mix(in srgb, var(--scan) 12%, transparent); }
    li[hidden] { display: block; opacity: 0; transform: translateY(4px); }
    b { font-weight: 700; }
    .wk-word { color: var(--alert); font-weight: 700; }
  }
  .who { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.6rem; font: 600 0.95rem/1 var(--hud); }
  .who::before { content: ''; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--scan); box-shadow: 0 0 8px var(--scan); }
  .stats {
    margin: 0;
    display: grid;
    gap: 0.3rem;
    font-size: 0.87rem;

    div { display: grid; grid-template-columns: 1.8rem 1fr 2ch; align-items: center; gap: 0.6rem; }
    dt { font: 600 0.85rem/1 var(--hud); color: var(--dim); }
    dd { margin: 0; text-align: right; font: 600 0.9rem/1 var(--hud); }
  }
  .meter {
    display: flex;
    gap: 2px;
    height: 0.5rem;

    i { flex: 1; background: var(--line); border-radius: 1px; }
    i.on { background: var(--scan); }
  }

  /* ------------------------------------------------------------------ list */
  .listing { margin-top: 2.6rem; }
  .listing__head {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    justify-content: space-between;
    gap: 0.75rem 1.5rem;
    margin-bottom: 0.8rem;

    h2 { margin: 0; font: 700 1.8rem/1 var(--hud); }
  }
  .search {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex: 0 1 22rem;

    label { color: var(--dim); white-space: nowrap; font-weight: 600; }
    input {
      flex: 1;
      min-width: 0;
      padding: 0.5rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--hull);
      color: var(--ink);
      font: inherit;

      &::placeholder { color: var(--dim); }
      &:focus-visible { outline: none; border-color: var(--scan); }
    }
  }
  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  table {
    width: 100%;
    min-width: 50rem;
    border-collapse: collapse;
    font-size: 0.92rem;

    th {
      text-align: left;
      font: 600 0.8rem/1 var(--hud);
      color: var(--dim);
      padding: 0.7rem 0.75rem;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 70%, transparent);
    }
    td { padding: 0.45rem 0.75rem; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
    tr:last-child td { border-bottom: 0; }
    .lv { width: 3.5rem; font: 700 1.05rem/1 var(--hud); color: var(--scan); }
    td.name { font-weight: 700; }
    td.arcana { color: var(--dim); }
    tbody tr {
      cursor: pointer;
      &:hover, &:focus-visible { outline: none; background: color-mix(in srgb, var(--scan) 9%, transparent); }
      &:focus-visible td.name { text-decoration: underline 2px var(--scan); text-underline-offset: 4px; }
    }
    .tag {
      margin-left: 0.55rem;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      border: 1px solid var(--scan);
      color: var(--scan);
      font: 600 0.72rem/1 var(--hud);
    }
  }
  .aff {
    display: grid;
    grid-template-columns: repeat(9, 2.3rem);
    gap: 3px;
    text-align: center;
    font: 600 0.75rem/1 var(--hud);

    > span { display: grid; gap: 2px; }
    .h { color: var(--dim); }
    .v { padding: 0.25rem 0; border-radius: 3px; background: color-mix(in srgb, var(--ink) 6%, transparent); }
    .n { color: var(--dim); font-weight: 500; }
    .wk { background: var(--alert); color: var(--alert-ink); }
    .nu, .rp, .dr, .rs { box-shadow: inset 0 0 0 1px var(--ink); }
  }

  /* ------------------------------------------------------------------ prototype bar */
  .proto {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 60;
    display: flex;
    gap: 0.75rem;
    padding: 0.5rem 0.75rem;
    font: 500 12px/1 system-ui, sans-serif;
    background: rgba(20, 20, 22, 0.92);
    border: 1px solid #3a3a3e;
    border-radius: 6px;

    a { color: #ddd; }
  }
  html.is-preview .proto { display: none; }

  /* ------------------------------------------------------------------ responsive */
  @media (max-width: 1100px) {
    .console { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .scope-wrap { grid-column: 1 / -1; order: -1; }
  }
  @media (max-width: 960px) {
    .bar { flex-wrap: wrap; gap: 0.5rem 1rem; padding: 0.7rem 1rem 0; }
    .bar__count { margin-left: auto; }
    .nav { order: 3; flex-basis: 100%; overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: none; }
    main { padding: 1.3rem 1rem 5rem; }
  }
  @media (max-width: 640px) {
    .console { grid-template-columns: 1fr; }
    .mk { width: 2.6rem; height: 2.6rem; margin: -1.3rem 0 0 -1.3rem; font-size: 0.62rem; b { font-size: 0.8rem; } }
  }

  @media (prefers-reduced-motion: reduce) {
    .mk, .log li { transition: none; }
    .scope[data-scan='sweeping'] .sweep { animation: none; opacity: 0; }
  }
</style>
</head>
<body>

<header class="bar">
  <a class="brand" href="#" aria-label="P3R Companion home">P3R Companion</a>
  <nav class="nav" aria-label="Sections">
    <a href="#" aria-current="page">Fusion</a>
    <a href="#">Compendium</a>
    <a href="#">Personas</a>
    <a href="#">Skills</a>
    <a href="#">Shadows</a>
    <a href="#">Classroom</a>
  </nav>
  <span class="bar__count"><b data-total></b> personas on record</span>
</header>

<main>
  <div class="modebar">
    <div>
      <h1>Fusion</h1>
      <p>Pick two personas and I'll tell you what they make.</p>
    </div>
    <div class="modes" role="group" aria-label="Fusion mode">
      <button type="button" aria-pressed="true">Forward</button>
      <button type="button" aria-pressed="false">Reverse</button>
      <button type="button" aria-pressed="false">Route</button>
    </div>
  </div>

  <div class="console">
    <div class="targets" data-targets></div>

    <section class="scope-wrap" aria-labelledby="r-name">
      <div class="scope" data-scan="done">
        <div class="sweep" aria-hidden="true"></div>
        <div class="core">
          <p>Result</p>
          <h2 id="r-name" data-r-name></h2>
          <span class="core__lv" data-r-sub></span>
        </div>
        <div data-markers></div>
      </div>
      <p class="legend">Amber is weak. A ring means it resists or nulls.</p>
    </section>

    <div class="side">
      <section class="panel" aria-labelledby="nav-title">
        <h2 class="who" id="nav-title">Navigator</h2>
        <ol class="log" data-log aria-live="polite"></ol>
      </section>
      <section class="panel" aria-labelledby="st-title">
        <h3 id="st-title">Stats</h3>
        <dl class="stats" data-stats></dl>
        <h3 style="margin-top:0.9rem">Skills</h3>
        <ul class="skills" data-r-skills></ul>
      </section>
    </div>
  </div>

  <section class="listing" aria-labelledby="list-title">
    <div class="listing__head">
      <h2 id="list-title">Personas</h2>
      <div class="search">
        <label for="q">Search</label>
        <input id="q" placeholder="Name or arcana" autocomplete="off" />
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th class="lv">Lv</th><th>Name</th><th>Arcana</th><th><div class="aff" data-aff-head></div></th></tr></thead>
        <tbody data-rows></tbody>
      </table>
    </div>
  </section>
</main>

<div class="proto" aria-label="Prototype controls">
  <a href="index.html">All prototypes</a>
</div>

<script src="p3r-data.js"></script>
<script>
  const { ELEMENTS, WORD, PARENTS, RESULT, RULE, PERSONAS, TOTAL, strip, stripHead, skillList, wireSearch, wireToggles, moment } = P3R;
  const $ = (s) => document.querySelector(s);

  $('[data-total]').textContent = TOTAL;
  $('[data-targets]').innerHTML = PARENTS.map((p, i) => `
    <section class="panel target" aria-labelledby="p${i}-t">
      <h2 id="p${i}-t">Parent ${i + 1}</h2>
      <div class="slot">
        <label for="p${i}">Parent ${i + 1} persona</label>
        <input id="p${i}" value="${p.name}" autocomplete="off" spellcheck="false" />
        <button type="button" aria-label="Clear parent ${i + 1}">Clear</button>
      </div>
      <p class="meta"><span>Arcana <b>${p.arcana}</b></span><span>Lv <b>${p.lv}</b></span><span>Inherits <b>${p.inherits}</b></span></p>
      <ul class="skills">${skillList(p.skills)}</ul>
    </section>`).join('');

  $('[data-r-name]').textContent = RESULT.name;
  $('[data-r-sub]').textContent = `${RESULT.arcana}, Lv ${RESULT.lv}`;
  $('[data-r-skills]').innerHTML = skillList(RESULT.skills);
  $('[data-stats]').innerHTML = RESULT.stats.map(([k, v]) =>
    `<div><dt>${k}</dt><span class="meter" role="img" aria-label="${v} of 99">${Array.from({ length: 10 }, (_, i) => `<i class="${i < Math.ceil(v / 9.9) ? 'on' : ''}"></i>`).join('')}</span><dd>${v}</dd></div>`).join('');

  /* Markers round the orbit, clockwise from the top. Orbit radius is set in px from the scope's size. */
  const scope = $('.scope');
  const step = 360 / ELEMENTS.length;
  $('[data-markers]').innerHTML = ELEMENTS.map(([e, ab], i) => {
    const v = RESULT.aff[e];
    return `<button type="button" class="mk ${v ? v.toLowerCase() : 'n'}" data-el="${e}" style="--a:${i * step}deg"
      aria-label="${e}: ${v ? WORD[v] : 'neutral'}">${ab}<b>${v || '–'}</b></button>`;
  }).join('');
  const markers = [...document.querySelectorAll('.mk')];
  const place = () => {
    const r = scope.clientWidth * 0.44;
    markers.forEach((m) => { m.style.transform = `rotate(var(--a)) translateY(${-r}px) rotate(calc(var(--a) * -1))`; });
  };
  new ResizeObserver(place).observe(scope);

  /* The navigator's lines, all from the data. `el` links a line to its marker. */
  const weak = Object.keys(RESULT.aff).filter((e) => RESULT.aff[e] === 'Wk');
  const strong = Object.keys(RESULT.aff).filter((e) => RESULT.aff[e] !== 'Wk');
  const innate = RESULT.skills.filter(([, lv]) => !lv).map(([n]) => n);
  const LINES = [
    { text: `Got it. That's <b>${RESULT.name}</b>, a ${RESULT.arcana} persona at level ${RESULT.lv}.` },
    { text: `${RULE.arcana.join(' and ')} make ${RULE.makes}. The first ${RULE.makes} from level ${RULE.from} is ${RESULT.name}.` },
    ...weak.map((e) => ({ el: e, alert: true, text: `It's <span class="wk-word">weak to ${e.toLowerCase()}</span>. Please be careful with that one!` })),
    ...strong.map((e) => ({ el: e, text: `It ${WORD[RESULT.aff[e]]} ${e.toLowerCase()}, so ${e.toLowerCase()} attacks won't do much.` })),
    { text: `It starts with ${innate.join(' and ')}, and can pass on ${RESULT.inherits} skills.` },
  ];
  const log = $('[data-log]');
  log.innerHTML = LINES.map((l) => `<li${l.el ? ` data-el="${l.el}"` : ''}${l.alert ? ' class="is-alert"' : ''}>${l.text}</li>`).join('');
  const lines = [...log.children];

  /* Hover or focus a marker and its line lights up, and the other way round. */
  const light = (el, on) => {
    markers.forEach((m) => m.classList.toggle('is-lit', on && m.dataset.el === el));
    lines.forEach((l) => l.classList.toggle('is-lit', on && l.dataset.el === el));
  };
  [...markers, ...lines.filter((l) => l.dataset.el)].forEach((n) => {
    n.addEventListener('pointerenter', () => light(n.dataset.el, true));
    n.addEventListener('pointerleave', () => light(n.dataset.el, false));
    n.addEventListener('focus', () => light(n.dataset.el, true));
    n.addEventListener('blur', () => light(n.dataset.el, false));
  });

  $('[data-aff-head]').innerHTML = stripHead();
  const rows = $('[data-rows]');
  rows.innerHTML = PERSONAS.map((p) => `
    <tr tabindex="0">
      <td class="lv">${p.lv}</td>
      <td class="name">${p.name}${p.tag ? `<span class="tag">${p.tag}</span>` : ''}</td>
      <td class="arcana">${p.arcana}</td>
      <td><div class="aff">${strip(p.aff)}</div></td>
    </tr>`).join('');
  wireSearch($('#q'), rows);
  wireToggles($('.modes'));

  /* ---- Signature: one sweep of the scanner. Markers appear as the beam passes; then the navigator speaks. ---- */
  const TURN = 1800;
  moment((at, end) => {
    scope.dataset.scan = 'sweeping';
    lines.forEach((l) => { l.hidden = true; });
    markers.forEach((m, i) => { m.classList.remove('is-found'); at(150 + (i * step / 360) * TURN, () => m.classList.add('is-found')); });
    lines.forEach((l, i) => at(TURN + 150 + i * 380, () => { l.hidden = false; }));
    at(TURN + 300 + lines.length * 380, end);
  }, () => {
    scope.dataset.scan = 'done';
    markers.forEach((m) => m.classList.add('is-found'));
    lines.forEach((l) => { l.hidden = false; });
  }).play();
</script>
</body>
</html>
