name: CI

# Test, build, and validate the committed data on every push and PR. The §8.4
# data checks run against the committed JSON (scripts/validate-data.mjs), so data
# rot is caught without re-running the gitignored importer.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci`'s postinstall (scripts/ensure-license.mjs) generates the
      # gitignored src/environments/license.ts from its committed template, so the
      # build compiles on a clean checkout.
      - run: npm ci

      - name: Validate committed datasets (§8.4)
        run: node scripts/validate-data.mjs

      - name: Unit tests
        run: npx ng test --no-watch

      - name: Production build
        run: npm run build
