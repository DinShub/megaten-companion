<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototype — Tide · P3R Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,600;0,800;1,800;1,900&display=swap" rel="stylesheet" />
<style>
  /* ------------------------------------------------------------------
     Tokens. --blue is the game accent (P3R = blue): drive it off
     --p-primary-500, and --cyan off --p-primary-300. --abyss/--deep
     become this skin's surface ramp. Layout idea: nothing sits level.
     Every band leans forward at the same angle (--lean), the result is a
     slab cut on the diagonal, and the type is heavy italic that runs off it.
     ------------------------------------------------------------------ */
  :root {
    --abyss: #051733;           /* page: deep water, blue not black */
    --deep: #0b2f6b;            /* raised bands */
    --line: #1f4a8c;
    --blue: #1e6bff;            /* P3R blue, --p-primary-500 */
    --cyan: #6fe6ff;            /* highlight, --p-primary-300 */
    --cyan-ink: #04203f;        /* text on cyan, 11:1 */
    --foam: #eef6ff;
    --mist: #a9c3e6;            /* secondary text, 8.6:1 on --abyss */
    --lean: -8deg;
    --type: 'Kanit', system-ui, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
      radial-gradient(90% 60% at 85% -10%, color-mix(in srgb, var(--blue) 35%, transparent), transparent 70%),
      var(--abyss);
    color: var(--foam);
    font: 400 15px/1.55 var(--type);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }

  /* A leaning band: the box skews, its content stands up straight again. */
  .lean { transform: skewX(var(--lean)); }
  .lean > * { transform: skewX(calc(var(--lean) * -1)); }

  /* ------------------------------------------------------------------ header */
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 2rem;
    padding: 0.9rem 2rem 1.3rem;
    background: var(--blue);
    clip-path: polygon(0 0, 100% 0, 100% 72%, 0 100%);
  }
  .brand {
    font: italic 900 1.7rem/1 var(--type);
    text-decoration: none;
    white-space: nowrap;
    letter-spacing: -0.01em;
  }
  .nav {
    display: flex;
    gap: 0.35rem;
    flex: 1;

    a {
      display: block;
      padding: 0.35rem 0.95rem;
      text-decoration: none;
      font-weight: 600;
      color: var(--foam);
      transform: skewX(var(--lean));
      transition: background 0.15s, color 0.15s;

      span { display: block; transform: skewX(calc(var(--lean) * -1)); }
      &:hover { background: color-mix(in srgb, var(--abyss) 30%, transparent); }
      &:active { transform: skewX(var(--lean)) translateY(1px); }
      &[aria-current='page'] { background: var(--foam); color: var(--cyan-ink); }
    }
  }
  .bar__count { font-size: 0.9rem; white-space: nowrap; b { font-weight: 800; } }

  /* ------------------------------------------------------------------ layout */
  main { max-width: 1240px; margin: 0 auto; padding: 1.5rem 2rem 5rem; }
  .modebar {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    justify-content: space-between;
    gap: 1rem 2rem;
    margin-bottom: 2rem;

    h1 { margin: 0; font: italic 900 clamp(3rem, 7vw, 5.2rem)/0.85 var(--type); letter-spacing: -0.02em; }
    p { margin: 0.5rem 0 0; color: var(--mist); }
  }
  .modes {
    display: inline-flex;
    gap: 0.3rem;

    button {
      font: 600 0.95rem/1 var(--type);
      padding: 0.65rem 1.2rem;
      border: 2px solid var(--line);
      background: transparent;
      color: var(--mist);
      cursor: pointer;
      transform: skewX(var(--lean));
      transition: border-color 0.15s, color 0.15s, background 0.15s;

      &:hover { color: var(--foam); border-color: var(--cyan); }
      &:active { transform: skewX(var(--lean)) translateY(1px); }
      &[aria-pressed='true'] { background: var(--cyan); border-color: var(--cyan); color: var(--cyan-ink); }
      span { display: block; transform: skewX(calc(var(--lean) * -1)); }
    }
  }

  .fusion > *, .parents > * { min-width: 0; }
  .fusion {
    display: grid;
    grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.5fr);
    gap: 2.5rem;
    align-items: start;
  }

  /* ------------------------------------------------------------------ parents */
  /* Inline padding keeps the leaning corners inside the column. */
  .parents { display: grid; gap: 0.6rem; padding-inline: 1.2rem; }
  .parent {
    padding: 1rem 1.4rem 1.1rem;
    background: var(--deep);
    border-left: 6px solid var(--blue);
    transition: border-color 0.15s, background 0.15s;

    &:hover, &:focus-within { border-left-color: var(--cyan); background: color-mix(in srgb, var(--deep) 80%, var(--blue)); }
  }
  .parent__label { margin: 0; font-size: 0.85rem; color: var(--mist); font-weight: 400; }
  .slot {
    display: flex;
    align-items: center;
    gap: 0.6rem;

    label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    input {
      flex: 1;
      min-width: 0;
      width: 0;
      padding: 0;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--foam);
      font: italic 800 2rem/1.15 var(--type);

      &:focus-visible { outline: none; border-bottom-color: var(--cyan); }
    }
    button {
      border: 2px solid var(--line);
      background: transparent;
      color: var(--mist);
      font: 600 0.8rem/1 var(--type);
      padding: 0.35rem 0.7rem;
      cursor: pointer;

      &:hover { color: var(--foam); border-color: var(--mist); }
    }
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.15rem 1.1rem;
    margin: 0.1rem 0 0.6rem;
    font-size: 0.88rem;
    color: var(--mist);

    b { color: var(--foam); font-weight: 600; }
  }
  .skills {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr));
    gap: 0.1rem 1.2rem;
    font-size: 0.9rem;

    li { display: flex; justify-content: space-between; gap: 0.5rem; }
    .lv { color: var(--mist); font-variant-numeric: tabular-nums; }
    .innate { font-weight: 600; }
  }
  .plus {
    margin: -0.2rem 0 -0.2rem 2rem;
    font: italic 900 2.6rem/1 var(--type);
    color: var(--cyan);
  }

  /* ------------------------------------------------------------------ the slab */
  .result { position: relative; }
  .slab {
    position: relative;
    overflow: hidden;
    padding: 1.6rem 3.4rem 1.8rem 2.6rem;
    background: linear-gradient(115deg, var(--blue) 0%, color-mix(in srgb, var(--blue) 70%, var(--cyan)) 100%);
    color: var(--foam);
    clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
    transition: clip-path 0.7s cubic-bezier(0.7, 0, 0.2, 1);
  }
  /* The level, huge and outlined, sitting behind the name. */
  .slab__lv {
    position: absolute;
    right: 4%;
    top: -2.2rem;
    font: italic 900 15rem/1 var(--type);
    color: transparent;
    -webkit-text-stroke: 2px color-mix(in srgb, var(--foam) 45%, transparent);
    pointer-events: none;
  }
  .slab__eyebrow { margin: 0; font-weight: 600; color: color-mix(in srgb, var(--foam) 85%, transparent); }
  .slab__name {
    position: relative;
    margin: 0 0 1rem -0.15em;
    font: italic 900 clamp(3.8rem, 8.5vw, 7rem)/0.86 var(--type);
    letter-spacing: -0.03em;
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s;
  }
  .readouts {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1.8rem;
    margin-bottom: 1.3rem;
    font-size: 0.9rem;

    b { font: italic 800 1.5rem/1 var(--type); margin-left: 0.35rem; }
  }
  .slab-grid {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.2fr);
    gap: 1.25rem 2.2rem;
  }
  .slab h3 { margin: 0 0 0.45rem; font: italic 800 1.15rem/1 var(--type); }
  /* Stats lean too. 99 is the cap. */
  .stats {
    margin: 0;
    display: grid;
    gap: 0.35rem;
    font-size: 0.9rem;

    div { display: grid; grid-template-columns: 1.8rem 1fr 2ch; align-items: center; gap: 0.6rem; }
    dt { font-weight: 600; }
    dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  }
  .meter {
    height: 0.7rem;
    background: color-mix(in srgb, var(--abyss) 35%, transparent);
    transform: skewX(var(--lean));

    i { display: block; height: 100%; width: calc(var(--v) / 99 * 100%); min-width: 3px; background: var(--foam); }
  }
  /* Affinities: leaning chips. Weak is the loud one: foam fill + the code, never colour alone. */
  .aff {
    display: grid;
    grid-template-columns: repeat(9, minmax(2.2rem, 1fr));
    gap: 4px;
    text-align: center;
    font-size: 0.8rem;

    > span { display: grid; gap: 3px; }
    .h { font-weight: 600; }
    .v {
      padding: 0.2rem 0;
      font-weight: 800;
      background: color-mix(in srgb, var(--abyss) 30%, transparent);
      transform: skewX(var(--lean));
    }
    .n { font-weight: 400; opacity: 0.6; }
    .wk { background: var(--foam); color: var(--cyan-ink); }
    .nu, .rp, .dr { box-shadow: inset 0 0 0 2px var(--foam); }
  }
  .legend { margin: 0.55rem 0 0; font-size: 0.78rem; }
  .slab .skills { position: relative; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); }
  .slab .skills .lv { color: color-mix(in srgb, var(--foam) 80%, transparent); }
  .rule {
    margin: 1rem 0 0 1.4rem;
    color: var(--mist);
    font-size: 0.92rem;

    b { color: var(--cyan); font-weight: 600; }
  }

  /* Signature: the wave. It crosses the slab, the slab opens behind it, the name rides in on it. */
  .wave {
    position: absolute;
    inset: -10% auto -10% 0;
    width: 40%;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    background: linear-gradient(100deg, transparent, color-mix(in srgb, var(--cyan) 85%, white) 45%, var(--foam) 55%, transparent);
    transform: translateX(-110%) skewX(var(--lean));
    transition: transform 0.8s cubic-bezier(0.55, 0, 0.25, 1), opacity 0.2s;
  }
  .result[data-wave='before'] .slab { clip-path: polygon(5% 0, 5% 0, 0 100%, 0 100%); }
  .result[data-wave='before'] .slab__name,
  .result[data-wave='wash'] .slab__name { transform: translateX(-35%); opacity: 0; }
  .result[data-wave='wash'] .wave { opacity: 1; transform: translateX(290%) skewX(var(--lean)); }

  /* Pointer ripples: rings that open where you press. */
  .ripple {
    position: fixed;
    z-index: 50;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border: 2px solid var(--cyan);
    border-radius: 50%;
    pointer-events: none;
    animation: ripple 0.7s ease-out forwards;
  }
  @keyframes ripple { to { transform: scale(9); opacity: 0; } }

  /* ------------------------------------------------------------------ list */
  .listing { margin-top: 3.25rem; }
  .listing__head {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    justify-content: space-between;
    gap: 0.75rem 1.5rem;
    margin-bottom: 0.9rem;

    h2 { margin: 0; font: italic 900 2.4rem/1 var(--type); }
  }
  .search {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex: 0 1 23rem;

    label { font-weight: 600; color: var(--mist); white-space: nowrap; }
    input {
      flex: 1;
      min-width: 0;
      padding: 0.55rem 0.9rem;
      border: 2px solid var(--line);
      background: var(--abyss);
      color: var(--foam);
      font: inherit;
      transform: skewX(var(--lean));

      &::placeholder { color: var(--mist); }
      &:focus-visible { outline: none; border-color: var(--cyan); }
    }
  }
  .table-scroll { overflow-x: auto; }
  table {
    width: 100%;
    min-width: 50rem;
    border-collapse: collapse;
    font-size: 0.95rem;

    th {
      text-align: left;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--mist);
      padding: 0 0.75rem 0.5rem 0;
      border-bottom: 2px solid var(--line);
    }
    td { padding: 0.45rem 0.75rem 0.45rem 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
    .lv { width: 4rem; font: italic 800 1.3rem/1 var(--type); color: var(--cyan); font-variant-numeric: tabular-nums; padding-left: 0.6rem; }
    td.name { font-weight: 600; }
    td.arcana { color: var(--mist); }
    tbody tr {
      cursor: pointer;
      transition: background 0.12s;

      &:hover, &:focus-visible {
        outline: none;
        background: linear-gradient(100deg, transparent 0 1%, color-mix(in srgb, var(--blue) 30%, transparent) 1% 99%, transparent 99%);
      }
      &:focus-visible td.name { text-decoration: underline 3px var(--cyan); text-underline-offset: 4px; }
    }
    .tag {
      display: inline-block;
      margin-left: 0.6rem;
      padding: 0 0.5rem;
      background: var(--cyan);
      color: var(--cyan-ink);
      font-size: 0.75rem;
      font-weight: 600;
      transform: skewX(var(--lean));
    }
    .aff { grid-template-columns: repeat(9, 2.4rem); }
    .aff .v { background: color-mix(in srgb, var(--deep) 80%, transparent); }
    .aff .wk { background: var(--cyan); color: var(--cyan-ink); }
    .aff .nu, .aff .rp, .aff .dr { box-shadow: inset 0 0 0 2px var(--foam); }
  }

  /* ------------------------------------------------------------------ prototype bar */
  .proto {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 60;
    display: flex;
    gap: 0.75rem;
    padding: 0.5rem 0.75rem;
    font: 500 12px/1 system-ui, sans-serif;
    background: rgba(20, 20, 22, 0.92);
    border: 1px solid #3a3a3e;
    border-radius: 6px;

    a { color: #ddd; }
  }
  html.is-preview .proto { display: none; }

  /* ------------------------------------------------------------------ responsive */
  @media (max-width: 960px) {
    .fusion { grid-template-columns: 1fr; }
    .bar { flex-wrap: wrap; gap: 0.5rem 1rem; padding: 0.8rem 1rem 1.6rem; clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%); }
    .bar__count { margin-left: auto; }
    .nav { order: 3; flex-basis: 100%; overflow-x: auto; padding: 0 0 0.2rem 0.4rem; scrollbar-width: none; }
    main { padding: 1.25rem 1rem 5rem; }
  }
  @media (max-width: 560px) {
    .slab { padding: 1.3rem 1.4rem 1.5rem 1.8rem; clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); }
    .slab__lv { font-size: 10rem; top: -1.2rem; }
    .slab-grid { grid-template-columns: 1fr; }
    .slab .aff { grid-template-columns: repeat(5, 1fr); }
    .rule { margin-left: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .slab, .slab__name, .wave { transition: none; }
    .ripple { display: none; }
  }
</style>
</head>
<body>

<header class="bar">
  <a class="brand" href="#" aria-label="P3R Companion home">P3R Companion</a>
  <nav class="nav" aria-label="Sections">
    <a href="#" aria-current="page"><span>Fusion</span></a>
    <a href="#"><span>Compendium</span></a>
    <a href="#"><span>Personas</span></a>
    <a href="#"><span>Skills</span></a>
    <a href="#"><span>Shadows</span></a>
    <a href="#"><span>Classroom</span></a>
  </nav>
  <span class="bar__count"><b data-total></b> personas</span>
</header>

<main>
  <div class="modebar">
    <div>
      <h1>Fusion</h1>
      <p>Pick two personas to see what they make.</p>
    </div>
    <div class="modes" role="group" aria-label="Fusion mode">
      <button type="button" aria-pressed="true"><span>Forward</span></button>
      <button type="button" aria-pressed="false"><span>Reverse</span></button>
      <button type="button" aria-pressed="false"><span>Route</span></button>
    </div>
  </div>

  <div class="fusion">
    <div class="parents" data-parents></div>

    <section class="result" data-wave="done" aria-labelledby="r-name">
      <div class="slab" aria-live="polite">
        <span class="slab__lv" aria-hidden="true" data-r-lv></span>
        <p class="slab__eyebrow">Result</p>
        <h2 class="slab__name" id="r-name" data-r-name></h2>
        <div class="readouts">
          <div>Arcana<b data-r-arcana></b></div>
          <div>Lv<b data-r-level></b></div>
          <div>Inherits<b data-r-inherits></b></div>
        </div>
        <div class="slab-grid">
          <div>
            <h3>Stats</h3>
            <dl class="stats" data-stats></dl>
          </div>
          <div>
            <h3>Affinities</h3>
            <div class="aff" data-aff></div>
            <p class="legend">Wk weak (filled), Rs resist, Nu null (outlined)</p>
          </div>
        </div>
        <h3 style="margin-top:1.2rem">Skills</h3>
        <ul class="skills" data-r-skills></ul>
      </div>
      <div class="wave" aria-hidden="true"></div>
      <p class="rule" data-rule></p>
    </section>
  </div>

  <section class="listing" aria-labelledby="list-title">
    <div class="listing__head">
      <h2 id="list-title">Personas</h2>
      <div class="search">
        <label for="q">Search</label>
        <input id="q" placeholder="Name or arcana" autocomplete="off" />
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th class="lv">Lv</th><th>Name</th><th>Arcana</th><th><div class="aff" data-aff-head></div></th></tr></thead>
        <tbody data-rows></tbody>
      </table>
    </div>
  </section>
</main>

<div class="proto" aria-label="Prototype controls">
  <a href="index.html">All prototypes</a>
</div>

<script src="p3r-data.js"></script>
<script>
  const { PARENTS, RESULT, RULE, PERSONAS, TOTAL, strip, stripHead, skillList, wireSearch, wireToggles, moment } = P3R;
  const $ = (s) => document.querySelector(s);

  $('[data-total]').textContent = TOTAL;
  $('[data-parents]').innerHTML = PARENTS.map((p, i) => `
    ${i ? '<div class="plus" aria-hidden="true">+</div>' : ''}
    <section class="parent lean" aria-labelledby="p${i}-t"><div>
      <h2 class="parent__label" id="p${i}-t">Parent ${i + 1}</h2>
      <div class="slot">
        <label for="p${i}">Parent ${i + 1} persona</label>
        <input id="p${i}" value="${p.name}" autocomplete="off" spellcheck="false" />
        <button type="button" aria-label="Clear parent ${i + 1}">Clear</button>
      </div>
      <p class="meta"><span>Arcana <b>${p.arcana}</b></span><span>Lv <b>${p.lv}</b></span><span>Inherits <b>${p.inherits}</b></span></p>
      <ul class="skills">${skillList(p.skills)}</ul>
    </div></section>`).join('');

  $('[data-r-lv]').textContent = RESULT.lv;
  $('[data-r-name]').textContent = RESULT.name;
  $('[data-r-arcana]').textContent = RESULT.arcana;
  $('[data-r-level]').textContent = RESULT.lv;
  $('[data-r-inherits]').textContent = RESULT.inherits;
  $('[data-r-skills]').innerHTML = skillList(RESULT.skills);
  $('[data-aff]').innerHTML = strip(RESULT.aff, true);
  $('[data-stats]').innerHTML = RESULT.stats.map(([k, v]) =>
    `<div><dt>${k}</dt><span class="meter" role="img" aria-label="${v} of 99" style="--v:${v}"><i></i></span><dd>${v}</dd></div>`).join('');
  $('[data-rule]').innerHTML = `<b>${RULE.arcana.join(' + ')}</b> makes ${RULE.makes}. The first ${RULE.makes} from Lv ${RULE.from} is ${RESULT.name}.`;

  $('[data-aff-head]').innerHTML = stripHead();
  const rows = $('[data-rows]');
  rows.innerHTML = PERSONAS.map((p) => `
    <tr tabindex="0">
      <td class="lv">${p.lv}</td>
      <td class="name">${p.name}${p.tag ? `<span class="tag">${p.tag}</span>` : ''}</td>
      <td class="arcana">${p.arcana}</td>
      <td><div class="aff">${strip(p.aff)}</div></td>
    </tr>`).join('');
  wireSearch($('#q'), rows);
  wireToggles($('.modes'));

  /* ---- Signature: the wave crosses the slab. before → wash → done. ---- */
  const result = $('.result');
  moment((at, end) => {
    result.dataset.wave = 'before';
    at(200, () => { result.dataset.wave = 'wash'; });
    at(1100, end);
  }, () => { result.dataset.wave = 'done'; }).play();

  /* Pointer ripples, the one pointer-driven touch. */
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.addEventListener('pointerdown', (e) => {
      const r = document.createElement('span');
      r.className = 'ripple';
      r.style.left = `${e.clientX}px`;
      r.style.top = `${e.clientY}px`;
      document.body.append(r);
      r.addEventListener('animationend', () => r.remove());
    });
  }
</script>
</body>
</html>
