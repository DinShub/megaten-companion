<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototype — Monorail · P3R Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* ------------------------------------------------------------------
     Keywords: midnight, isolation, blue.
     Tokens. One hue only: --glow is the game accent (P3R blue,
     --p-primary-200) and every surface is the same blue taken darker
     (--p-primary-950 and below). --window is the single warm colour on the
     page and is used for one thing: the last lit window in the city.
     Layout idea: a lot of empty night. The city sits far away under an
     elevated track; the content is one narrow column on the left, and the
     space to its right is left empty on purpose.
     ------------------------------------------------------------------ */
  :root {
    --void: #040a1c;
    --deep: #0a1838;
    --panel: #0b1a3c;
    --line: #1d3263;
    --ink: #dce8ff;
    --dim: #8fa3c8;             /* 7.2:1 on --void */
    --glow: #9cc4ff;            /* P3R blue, --p-primary-200 */
    --glow-ink: #061230;
    --window: #ffe9a8;
    --type: 'Schibsted Grotesk', system-ui, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    overflow-x: hidden;
    background: var(--void);
    color: var(--ink);
    font: 400 14.5px/1.6 var(--type);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }

  /* ------------------------------------------------------------------ the night */
  .night {
    position: relative;
    height: 21rem;
    overflow: hidden;
    background: linear-gradient(to bottom, var(--void) 0%, var(--deep) 78%, #0f2149 100%);
  }
  .moon {
    position: absolute;
    top: 4.5rem;
    right: 16%;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #eef4ff, #b8ceef 70%);
    box-shadow: 0 0 40px 10px rgba(156, 196, 255, 0.25);
  }
  .city { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 6.5rem; }
  .city rect.b { fill: #071330; }
  .city rect.w { fill: #1a2c57; }
  .city rect.lit { fill: var(--window); filter: drop-shadow(0 0 3px var(--window)); }
  /* The elevated track and its pillars. */
  .track {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 7.5rem;
    height: 3px;
    background: #1a2d5c;
  }
  .track::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 3px;
    height: 7.5rem;
    background: repeating-linear-gradient(90deg, transparent 0 13rem, #0d1c40 13rem calc(13rem + 6px));
  }
  /* The train: one row of lit windows that crosses once and is gone. */
  .train {
    position: absolute;
    bottom: calc(7.5rem + 3px);
    left: 0;
    width: 34rem;
    height: 1.25rem;
    border-radius: 0.7rem 0.3rem 0.3rem 0.7rem;
    background:
      repeating-linear-gradient(90deg, transparent 0 0.6rem, rgba(220, 232, 255, 0.9) 0.6rem 1.7rem, transparent 1.7rem 2.2rem) 0 0.32rem / 100% 0.5rem no-repeat,
      #233b74;
    box-shadow: 0 0 30px rgba(156, 196, 255, 0.35);
    transform: translateX(-40rem);
    pointer-events: none;
  }
  .train.is-running { animation: train 3.2s cubic-bezier(0.4, 0, 0.6, 1) forwards; }
  @keyframes train { from { transform: translateX(105vw); } to { transform: translateX(-40rem); } }

  .bar {
    position: absolute;
    inset: 0 0 auto;
    z-index: 5;
    display: flex;
    align-items: baseline;
    gap: 2rem;
    padding: 1.1rem 12vw 0;
  }
  .brand { font-weight: 700; text-decoration: none; white-space: nowrap; }
  .nav {
    display: flex;
    gap: 1.2rem;
    flex: 1;

    a {
      text-decoration: none;
      color: var(--dim);
      white-space: nowrap;

      &:hover { color: var(--ink); }
      &[aria-current='page'] { color: var(--glow); }
    }
  }
  .bar__clock { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .night__title {
    position: absolute;
    left: 12vw;
    bottom: 9.6rem;
    z-index: 2;
    margin: 0;

    h1 { margin: 0; font: 500 2.4rem/1 var(--type); letter-spacing: -0.01em; }
    p { margin: 0.4rem 0 0; color: var(--dim); }
  }

  /* ------------------------------------------------------------------ the column */
  main { padding: 2.6rem 12vw 6rem; }
  .column { max-width: 38rem; display: grid; gap: 2.2rem; }
  .column > * { min-width: 0; }
  .modes {
    display: inline-flex;
    justify-self: start;
    gap: 0.3rem;

    button {
      padding: 0.45rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--dim);
      font: 500 0.88rem/1 var(--type);
      cursor: pointer;

      &:hover { color: var(--ink); border-color: var(--dim); }
      &:active { transform: translateY(1px); }
      &[aria-pressed='true'] { background: var(--glow); border-color: var(--glow); color: var(--glow-ink); }
    }
  }

  /* Parents: two quiet rows, no boxes. */
  .parents { display: grid; gap: 1.3rem; }
  .parent__label { margin: 0; color: var(--dim); font-size: 0.82rem; font-weight: 400; }
  .slot {
    display: flex;
    align-items: baseline;
    gap: 0.8rem;

    label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    input {
      flex: 1;
      width: 0;
      min-width: 0;
      padding: 0.05rem 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font: 500 1.6rem/1.3 var(--type);

      &:hover { border-bottom-color: var(--dim); }
      &:focus-visible { outline: none; border-bottom-color: var(--glow); }
    }
    button {
      border: 0;
      background: none;
      color: var(--dim);
      font: 400 0.8rem/1 var(--type);
      cursor: pointer;

      &:hover { color: var(--ink); text-decoration: underline; }
    }
  }
  .meta { margin: 0.35rem 0 0.4rem; color: var(--dim); font-size: 0.85rem; b { color: var(--ink); font-weight: 500; } }
  .skills {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr));
    gap: 0 1.3rem;
    font-size: 0.86rem;

    li { display: flex; justify-content: space-between; gap: 0.5rem; }
    .lv { color: var(--dim); font-variant-numeric: tabular-nums; }
    .innate { font-weight: 500; color: var(--ink); }
  }

  /* The result: the one lit thing in the column. */
  .result {
    position: relative;
    padding: 1.6rem 1.7rem 1.7rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(156, 196, 255, 0.06), 0 30px 80px -30px rgba(156, 196, 255, 0.28);
  }
  .result__eyebrow { margin: 0; color: var(--dim); font-size: 0.82rem; }
  .result__name { margin: 0.1rem 0 0.15rem; font: 500 clamp(2.6rem, 5vw, 3.4rem)/1.05 var(--type); color: var(--glow); letter-spacing: -0.015em; }
  .result__sub { margin: 0 0 1.3rem; color: var(--dim); b { color: var(--ink); font-weight: 500; } }
  .result h3 { margin: 0 0 0.45rem; font: 500 0.92rem/1.2 var(--type); color: var(--dim); }
  .stats {
    margin: 0 0 1.3rem;
    display: grid;
    gap: 0.3rem;
    font-size: 0.86rem;

    div { display: grid; grid-template-columns: 1.8rem 1fr 2ch; align-items: center; gap: 0.6rem; }
    dt { color: var(--dim); }
    dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  }
  .meter {
    height: 2px;
    background: var(--line);

    i { display: block; height: 100%; width: calc(var(--v) / 99 * 100%); min-width: 3px; background: var(--glow); box-shadow: 0 0 6px var(--glow); }
  }
  .aff {
    display: grid;
    grid-template-columns: repeat(9, minmax(1.9rem, 1fr));
    gap: 3px;
    text-align: center;
    font-size: 0.78rem;

    > span { display: grid; gap: 2px; }
    .h { color: var(--dim); }
    .v { padding: 0.15rem 0; border-radius: 3px; background: rgba(156, 196, 255, 0.06); font-weight: 500; }
    .n { color: var(--dim); font-weight: 400; }
    .wk { background: var(--glow); color: var(--glow-ink); font-weight: 700; }
    .nu, .rp, .dr { box-shadow: inset 0 0 0 1px var(--glow); }
  }
  .legend { margin: 0.45rem 0 1.3rem; font-size: 0.76rem; color: var(--dim); }
  .rule { margin: 0; color: var(--dim); font-size: 0.88rem; b { color: var(--ink); font-weight: 500; } }

  /* ------------------------------------------------------------------ list */
  .listing { margin-top: 4.5rem; max-width: 62rem; }
  .listing__head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem 1.5rem;
    margin-bottom: 0.8rem;

    h2 { margin: 0; font: 500 1.5rem/1 var(--type); }
  }
  .search {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    flex: 0 1 20rem;

    label { color: var(--dim); white-space: nowrap; }
    input {
      flex: 1;
      width: 0;
      min-width: 0;
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font: inherit;

      &::placeholder { color: var(--dim); }
      &:focus-visible { outline: none; border-color: var(--glow); }
    }
  }
  .table-scroll { overflow-x: auto; }
  table {
    width: 100%;
    min-width: 46rem;
    border-collapse: collapse;
    font-size: 0.88rem;

    th { text-align: left; font-weight: 400; color: var(--dim); padding: 0 0.75rem 0.5rem 0; font-size: 0.78rem; }
    td { padding: 0.45rem 0.75rem 0.45rem 0; border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
    .lv { width: 3rem; color: var(--glow); font-variant-numeric: tabular-nums; font-weight: 500; }
    td.name { font-weight: 500; }
    td.arcana { color: var(--dim); }
    tbody tr {
      cursor: pointer;
      &:hover, &:focus-visible { outline: none; background: rgba(156, 196, 255, 0.05); }
      &:focus-visible td.name { text-decoration: underline 1px var(--glow); text-underline-offset: 4px; }
    }
    .tag { margin-left: 0.5rem; color: var(--glow); font-size: 0.76rem; }
    .aff { grid-template-columns: repeat(9, 2.2rem); }
  }

  /* ------------------------------------------------------------------ prototype bar */
  .proto {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 60;
    display: flex;
    gap: 0.75rem;
    padding: 0.5rem 0.75rem;
    font: 500 12px/1 system-ui, sans-serif;
    background: rgba(20, 20, 22, 0.92);
    border: 1px solid #3a3a3e;
    border-radius: 6px;

    a { color: #ddd; }
  }
  html.is-preview .proto { display: none; }

  /* ------------------------------------------------------------------ responsive */
  @media (max-width: 960px) {
    .bar { flex-wrap: wrap; gap: 0.5rem 1rem; padding: 1rem 1rem 0; }
    .bar__clock { margin-left: auto; }
    .nav { order: 3; flex-basis: 100%; overflow-x: auto; scrollbar-width: none; }
    .night__title { left: 1rem; }
    main { padding: 2rem 1rem 5rem; }
    .moon { right: 1.5rem; }
  }
  @media (max-width: 560px) {
    .result { padding: 1.2rem 1.1rem; }
    .result .aff { grid-template-columns: repeat(5, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    .train, .train.is-running { animation: none; display: none; }
  }
</style>
</head>
<body>

<div class="night">
  <header class="bar">
    <a class="brand" href="#" aria-label="P3R Companion home">P3R Companion</a>
    <nav class="nav" aria-label="Sections">
      <a href="#" aria-current="page">Fusion</a>
      <a href="#">Compendium</a>
      <a href="#">Personas</a>
      <a href="#">Skills</a>
      <a href="#">Shadows</a>
      <a href="#">Classroom</a>
    </nav>
    <span class="bar__clock" data-total-line></span>
  </header>
  <div class="moon" aria-hidden="true"></div>
  <div class="night__title">
    <h1>Fusion</h1>
    <p>Pick two personas to see what they make.</p>
  </div>
  <div class="track" aria-hidden="true"></div>
  <div class="train" aria-hidden="true"></div>
  <svg class="city" viewBox="0 0 1440 104" preserveAspectRatio="none" aria-hidden="true" data-city></svg>
</div>

<main>
  <div class="column">
    <div class="modes" role="group" aria-label="Fusion mode">
      <button type="button" aria-pressed="true">Forward</button>
      <button type="button" aria-pressed="false">Reverse</button>
      <button type="button" aria-pressed="false">Route</button>
    </div>

    <div class="parents" data-parents></div>

    <section class="result" aria-labelledby="r-name">
      <p class="result__eyebrow">Result</p>
      <h2 class="result__name" id="r-name" data-r-name></h2>
      <p class="result__sub" data-r-sub></p>
      <h3>Stats</h3>
      <dl class="stats" data-stats></dl>
      <h3>Affinities</h3>
      <div class="aff" data-aff></div>
      <p class="legend">Wk weak (filled), Rs resist, Nu null (outlined)</p>
      <h3>Skills</h3>
      <ul class="skills" data-r-skills style="margin-bottom:1.3rem"></ul>
      <p class="rule" data-rule></p>
    </section>
  </div>

  <section class="listing" aria-labelledby="list-title">
    <div class="listing__head">
      <h2 id="list-title">Personas</h2>
      <div class="search">
        <label for="q">Search</label>
        <input id="q" placeholder="Name or arcana" autocomplete="off" />
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th class="lv">Lv</th><th>Name</th><th>Arcana</th><th><div class="aff" data-aff-head></div></th></tr></thead>
        <tbody data-rows></tbody>
      </table>
    </div>
  </section>
</main>

<div class="proto" aria-label="Prototype controls">
  <a href="index.html">All prototypes</a>
</div>

<script src="p3r-data.js"></script>
<script>
  const { PARENTS, RESULT, RULE, PERSONAS, TOTAL, strip, stripHead, skillList, wireSearch, wireToggles, moment } = P3R;
  const $ = (s) => document.querySelector(s);

  $('[data-total-line]').textContent = `${TOTAL} personas`;
  $('[data-parents]').innerHTML = PARENTS.map((p, i) => `
    <section aria-labelledby="p${i}-t">
      <h2 class="parent__label" id="p${i}-t">Parent ${i + 1}</h2>
      <div class="slot">
        <label for="p${i}">Parent ${i + 1} persona</label>
        <input id="p${i}" value="${p.name}" autocomplete="off" spellcheck="false" />
        <button type="button" aria-label="Clear parent ${i + 1}">Clear</button>
      </div>
      <p class="meta">${p.arcana}, Lv <b>${p.lv}</b>, inherits <b>${p.inherits}</b></p>
      <ul class="skills">${skillList(p.skills)}</ul>
    </section>`).join('');

  $('[data-r-name]').textContent = RESULT.name;
  $('[data-r-sub]').innerHTML = `${RESULT.arcana}, Lv <b>${RESULT.lv}</b>, inherits <b>${RESULT.inherits}</b>`;
  $('[data-r-skills]').innerHTML = skillList(RESULT.skills);
  $('[data-aff]').innerHTML = strip(RESULT.aff, true);
  $('[data-stats]').innerHTML = RESULT.stats.map(([k, v]) =>
    `<div><dt>${k}</dt><span class="meter" role="img" aria-label="${v} of 99" style="--v:${v}"><i></i></span><dd>${v}</dd></div>`).join('');
  $('[data-rule]').innerHTML = `<b>${RULE.arcana.join(' and ')}</b> make ${RULE.makes}. The first ${RULE.makes} from Lv ${RULE.from} is ${RESULT.name}.`;

  $('[data-aff-head]').innerHTML = stripHead();
  const rows = $('[data-rows]');
  rows.innerHTML = PERSONAS.map((p) => `
    <tr tabindex="0">
      <td class="lv">${p.lv}</td>
      <td class="name">${p.name}${p.tag ? `<span class="tag">${p.tag.toLowerCase()}</span>` : ''}</td>
      <td class="arcana">${p.arcana}</td>
      <td><div class="aff">${strip(p.aff)}</div></td>
    </tr>`).join('');
  wireSearch($('#q'), rows);
  wireToggles($('.modes'));

  /* The city: a seeded skyline, every window dark but one. */
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  let x = 0;
  let svg = '';
  const windows = [];
  while (x < 1440) {
    const w = 26 + Math.floor(rnd() * 50);
    const h = 30 + Math.floor(rnd() * 70);
    svg += `<rect class="b" x="${x}" y="${104 - h}" width="${w - 3}" height="${h}"/>`;
    for (let wy = 104 - h + 8; wy < 98; wy += 11) {
      for (let wx = x + 5; wx < x + w - 9; wx += 9) if (rnd() < 0.35) windows.push([wx, wy]);
    }
    x += w;
  }
  const lit = Math.floor(windows.length * 0.71);
  svg += windows.map(([wx, wy], i) => `<rect class="${i === lit ? 'lit' : 'w'}" x="${wx}" y="${wy}" width="4" height="5"/>`).join('');
  $('[data-city]').innerHTML = svg;

  /* ---- Signature: the last train crosses once, then the night is empty. ---- */
  const train = $('.train');
  moment((at, end) => {
    train.classList.add('is-running');
    at(3300, end);
  }, () => { train.classList.remove('is-running'); }).play();
</script>
</body>
</html>
