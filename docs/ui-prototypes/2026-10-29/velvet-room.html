<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototype — Velvet Room · P3R Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* ------------------------------------------------------------------
     Tokens. The velvet is the game accent taken dark (P3R = blue): drive
     --velvet/--velvet-2 off --p-primary-950/900 and --card-back off
     --p-primary-700. --gilt and --card are skin-only tokens (ornament and
     the printed card face). Layout idea: the fusion is a three-card spread
     on a velvet table, read left to right; the details sit underneath like
     the entry in the compendium.
     ------------------------------------------------------------------ */
  :root {
    --velvet: #0a1a4a;
    --velvet-2: #122a6e;
    --line: #2c4590;
    --ink: #efe9da;
    --dim: #bdb8d4;             /* 8.4:1 on --velvet */
    --gilt: #d7b56d;            /* ornament, 8:1 on --velvet */
    --card: #f1ead8;            /* printed card stock */
    --card-ink: #1d1838;
    --card-dim: #5a5374;        /* 6.6:1 on --card */
    --card-back: #1b3fa8;
    --display: 'IM Fell English', Georgia, serif;
    --caps: 'IM Fell English SC', Georgia, serif;
    --body: 'Alegreya Sans', system-ui, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(70% 55% at 50% 22%, var(--velvet-2), transparent 75%),
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.015) 0 2px, transparent 2px 5px),
      var(--velvet);
    color: var(--ink);
    font: 400 16px/1.6 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--gilt); outline-offset: 3px; }

  /* ------------------------------------------------------------------ header */
  .bar {
    display: flex;
    align-items: center;
    gap: 2rem;
    padding: 1rem 2rem;
    border-bottom: 1px solid color-mix(in srgb, var(--gilt) 35%, transparent);
  }
  .brand { font: 400 1.6rem/1 var(--display); text-decoration: none; white-space: nowrap; }
  .nav {
    display: flex;
    gap: 0.2rem;
    flex: 1;

    a {
      padding: 0.3rem 0.75rem;
      font: 400 1.05rem/1.2 var(--caps);
      text-decoration: none;
      color: var(--dim);
      white-space: nowrap;

      &:hover { color: var(--ink); }
      &[aria-current='page'] { color: var(--gilt); text-decoration: underline 1px; text-underline-offset: 6px; }
    }
  }
  .bar__count { color: var(--dim); white-space: nowrap; font-size: 0.95rem; b { color: var(--ink); } }

  /* ------------------------------------------------------------------ layout */
  main { max-width: 1180px; margin: 0 auto; padding: 2.2rem 2rem 5rem; }
  .modebar {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    justify-content: space-between;
    gap: 1rem 2rem;
    margin-bottom: 1.6rem;

    h1 { margin: 0; font: 400 clamp(2.8rem, 6vw, 4.2rem)/1 var(--display); }
    p { margin: 0.3rem 0 0; color: var(--dim); font: italic 400 1.15rem/1.4 var(--display); }
  }
  .modes {
    display: inline-flex;
    gap: 0.4rem;

    button {
      font: 400 1.05rem/1 var(--caps);
      padding: 0.55rem 1rem;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;

      &:hover { color: var(--ink); border-color: var(--gilt); }
      &:active { transform: translateY(1px); }
      &[aria-pressed='true'] { color: var(--velvet); background: var(--gilt); border-color: var(--gilt); }
    }
  }

  /* ------------------------------------------------------------------ the spread */
  .spread {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1.35fr;
    align-items: center;
    gap: 1.4rem;
    padding: 1.5rem 0 1rem;
  }
  .op { font: 400 2.6rem/1 var(--display); color: var(--gilt); text-align: center; }
  .seat { display: grid; justify-items: center; gap: 0.8rem; }
  .seat__slot {
    display: grid;
    gap: 0.1rem;
    width: min(100%, 13rem);
    text-align: center;

    label { font-size: 0.85rem; color: var(--dim); }
    input {
      width: 100%;
      padding: 0.15rem 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font: italic 400 1.3rem/1.2 var(--display);
      text-align: center;

      &:hover { border-bottom-color: var(--dim); }
      &:focus-visible { outline: none; border-bottom-color: var(--gilt); }
    }
  }

  /* A card. Proportions of a tarot deck (7:12). It tilts toward the pointer; a sheen follows it. */
  .card {
    --rx: 0deg;
    --ry: 0deg;
    --mx: 50%;
    --my: 30%;
    width: min(100%, 13rem);
    aspect-ratio: 7 / 12;
    perspective: 900px;
  }
  .card--big { width: min(100%, 17.5rem); }
  .card__inner {
    position: relative;
    height: 100%;
    transform-style: preserve-3d;
    transform: rotateX(var(--rx)) rotateY(calc(var(--ry) + var(--flip, 0deg)));
    transition: transform 0.25s ease-out;
  }
  .card[data-face='down'] .card__inner { --flip: 180deg; }
  .card.is-flipping .card__inner { transition: transform 1s cubic-bezier(0.3, 0.1, 0.2, 1); }
  .card__face, .card__back {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    backface-visibility: hidden;
    box-shadow: 0 22px 40px -18px rgba(0, 0, 0, 0.85);
    overflow: hidden;
  }
  .card__face {
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    padding: 0.7rem;
    background: var(--card);
    color: var(--card-ink);

    /* Double printed border. */
    &::before {
      content: '';
      position: absolute;
      inset: 0.4rem;
      border: 1px solid var(--card-ink);
      outline: 3px double color-mix(in srgb, var(--card-ink) 70%, transparent);
      outline-offset: -6px;
      border-radius: 6px;
      pointer-events: none;
    }
    /* Gilt sheen under the pointer. */
    &::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(40% 30% at var(--mx) var(--my), rgba(215, 181, 109, 0.35), transparent 70%);
      mix-blend-mode: multiply;
      opacity: 0;
      transition: opacity 0.2s;
    }
  }
  .card:hover .card__face::after { opacity: 1; }
  .card__no { margin: 0.35rem 0 0; text-align: center; font: 400 1.5rem/1 var(--caps); }
  .card__arcana { margin: 0.1rem 0 0; text-align: center; font: italic 400 0.95rem/1 var(--display); color: var(--card-dim); }
  /* The art: the persona's initial in a printed sunburst. */
  .card__art {
    position: relative;
    display: grid;
    place-items: center;
    margin: 0.6rem 0.5rem;
    border-radius: 50% 50% 6px 6px / 40% 40% 6px 6px;
    background:
      repeating-conic-gradient(from 0deg at 50% 60%, color-mix(in srgb, var(--card-ink) 16%, transparent) 0 3deg, transparent 3deg 12deg),
      color-mix(in srgb, var(--card-back) 10%, var(--card));
    font: 400 4.5rem/1 var(--display);
    color: var(--card-ink);
  }
  .card--big .card__art { font-size: 6.5rem; }
  .card__banner {
    position: relative;
    margin: 0 0.3rem 0.35rem;
    padding: 0.3rem 0.4rem 0.35rem;
    text-align: center;
    border-top: 1px solid var(--card-ink);

    h2, strong { display: block; margin: 0; font: 400 1.25rem/1.1 var(--display); }
    span { font-size: 0.85rem; color: var(--card-dim); }
  }
  .card--big .card__banner h2 { font-size: 1.7rem; }
  .card__back {
    transform: rotateY(180deg);
    background:
      radial-gradient(circle at 50% 50%, transparent 0 22%, var(--gilt) 22% 23%, transparent 23% 31%, var(--gilt) 31% 31.6%, transparent 31.6%),
      repeating-linear-gradient(45deg, color-mix(in srgb, var(--gilt) 30%, transparent) 0 1px, transparent 1px 14px),
      repeating-linear-gradient(-45deg, color-mix(in srgb, var(--gilt) 30%, transparent) 0 1px, transparent 1px 14px),
      var(--card-back);
    border: 6px solid var(--card);
  }

  .rule-text { margin: 0.8rem 0 2.2rem; text-align: center; font: italic 400 1.15rem/1.4 var(--display); color: var(--dim); b { color: var(--gilt); font-weight: 400; } }

  /* ------------------------------------------------------------------ the entry below the spread */
  .entry {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.35fr);
    gap: 2rem;
    padding-top: 1.6rem;
    border-top: 1px solid color-mix(in srgb, var(--gilt) 35%, transparent);
  }
  .entry h3 { margin: 0 0 0.4rem; font: 400 1.3rem/1.1 var(--display); }
  .entry .meta { margin: 0 0 0.6rem; color: var(--dim); font-size: 0.92rem; b { color: var(--ink); font-weight: 500; } }
  .skills {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.1rem;
    font-size: 0.95rem;

    li { display: flex; justify-content: space-between; gap: 0.5rem; border-bottom: 1px dotted color-mix(in srgb, var(--line) 80%, transparent); }
    .lv { color: var(--dim); font-variant-numeric: tabular-nums; }
    .innate { font-weight: 700; }
  }
  .result-detail { display: grid; gap: 1rem; }
  .result-detail .skills { grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); column-gap: 1.2rem; }
  .stats {
    margin: 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    text-align: center;
    border: 1px solid var(--line);

    div { padding: 0.4rem 0; & + div { border-left: 1px solid var(--line); } }
    dt { font: 400 0.95rem/1 var(--caps); color: var(--dim); }
    dd { margin: 0.15rem 0 0; font: 400 1.6rem/1 var(--display); }
  }
  /* Weak is the signal: gilt fill + the code. */
  .aff {
    display: grid;
    grid-template-columns: repeat(9, minmax(2rem, 1fr));
    gap: 3px;
    text-align: center;
    font-size: 0.82rem;

    > span { display: grid; gap: 2px; }
    .h { color: var(--dim); }
    .v { padding: 0.15rem 0; border: 1px solid var(--line); font-weight: 700; }
    .n { font-weight: 400; color: var(--dim); }
    .wk { background: var(--gilt); border-color: var(--gilt); color: var(--velvet); }
    .nu, .rp, .dr { border-color: var(--ink); }
  }
  .legend { margin: 0.45rem 0 0; font-size: 0.8rem; color: var(--dim); }

  /* ------------------------------------------------------------------ compendium list */
  .listing { margin-top: 3.2rem; }
  .listing__head {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    justify-content: space-between;
    gap: 0.75rem 1.5rem;
    margin-bottom: 0.8rem;

    h2 { margin: 0; font: 400 2.2rem/1 var(--display); }
  }
  .search {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex: 0 1 22rem;

    label { color: var(--dim); white-space: nowrap; }
    input {
      flex: 1;
      min-width: 0;
      padding: 0.45rem 0.2rem;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font: italic 400 1.1rem/1.2 var(--display);

      &::placeholder { color: var(--dim); }
      &:focus-visible { outline: none; border-bottom-color: var(--gilt); }
    }
  }
  .table-scroll { overflow-x: auto; }
  table {
    width: 100%;
    min-width: 50rem;
    border-collapse: collapse;

    th {
      text-align: left;
      font: 400 0.95rem/1 var(--caps);
      color: var(--dim);
      padding: 0 0.75rem 0.55rem 0;
      border-bottom: 1px solid color-mix(in srgb, var(--gilt) 45%, transparent);
    }
    td { padding: 0.5rem 0.75rem 0.5rem 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
    .lv { width: 3.5rem; font: 400 1.3rem/1 var(--display); font-variant-numeric: lining-nums tabular-nums; }
    td.name { font: 400 1.15rem/1.2 var(--display); }
    td.arcana { color: var(--dim); }
    .no { display: inline-block; min-width: 2.4rem; font-family: var(--caps); color: var(--gilt); }
    tbody tr {
      cursor: pointer;
      &:hover, &:focus-visible { outline: none; background: color-mix(in srgb, var(--gilt) 8%, transparent); }
      &:focus-visible td.name { text-decoration: underline 1px var(--gilt); text-underline-offset: 5px; }
    }
    .tag { margin-left: 0.55rem; font: italic 400 0.9rem/1 var(--display); color: var(--gilt); }
    .aff { grid-template-columns: repeat(9, 2.3rem); }
  }

  /* ------------------------------------------------------------------ prototype bar */
  .proto {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 60;
    display: flex;
    gap: 0.75rem;
    padding: 0.5rem 0.75rem;
    font: 500 12px/1 system-ui, sans-serif;
    background: rgba(20, 20, 22, 0.92);
    border: 1px solid #3a3a3e;
    border-radius: 6px;

    a { color: #ddd; }
  }
  html.is-preview .proto { display: none; }

  /* ------------------------------------------------------------------ responsive */
  @media (max-width: 960px) {
    .bar { flex-wrap: wrap; gap: 0.5rem 1rem; padding: 0.8rem 1rem 0; }
    .bar__count { margin-left: auto; }
    .nav { order: 3; flex-basis: 100%; overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: none; }
    main { padding: 1.4rem 1rem 5rem; }
    .spread { grid-template-columns: 1fr auto 1fr; row-gap: 0.6rem; }
    .spread .op--eq { grid-column: 1 / -1; }
    .spread .seat--result { grid-column: 1 / -1; }
    .entry { grid-template-columns: 1fr 1fr; }
    .entry .result-detail { grid-column: 1 / -1; order: -1; }
  }
  @media (max-width: 560px) {
    .entry { grid-template-columns: 1fr; }
    .aff { grid-template-columns: repeat(5, 1fr); }
    .op { font-size: 1.8rem; }
    .card__art { font-size: 3rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card__inner, .card.is-flipping .card__inner { transition: none; transform: rotateY(var(--flip, 0deg)); }
  }
</style>
</head>
<body>

<header class="bar">
  <a class="brand" href="#" aria-label="P3R Companion home">P3R Companion</a>
  <nav class="nav" aria-label="Sections">
    <a href="#" aria-current="page">Fusion</a>
    <a href="#">Compendium</a>
    <a href="#">Personas</a>
    <a href="#">Skills</a>
    <a href="#">Shadows</a>
    <a href="#">Classroom</a>
  </nav>
  <span class="bar__count"><b data-total></b> personas</span>
</header>

<main>
  <div class="modebar">
    <div>
      <h1>Fusion</h1>
      <p>Choose two personas. Their arcana decide the third.</p>
    </div>
    <div class="modes" role="group" aria-label="Fusion mode">
      <button type="button" aria-pressed="true">Forward</button>
      <button type="button" aria-pressed="false">Reverse</button>
      <button type="button" aria-pressed="false">Route</button>
    </div>
  </div>

  <div class="spread" data-spread></div>
  <p class="rule-text" data-rule></p>

  <div class="entry" data-entry></div>

  <section class="listing" aria-labelledby="list-title">
    <div class="listing__head">
      <h2 id="list-title">Compendium</h2>
      <div class="search">
        <label for="q">Search</label>
        <input id="q" placeholder="Name or arcana" autocomplete="off" />
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th class="lv">Lv</th><th>Name</th><th>Arcana</th><th><div class="aff" data-aff-head></div></th></tr></thead>
        <tbody data-rows></tbody>
      </table>
    </div>
  </section>
</main>

<div class="proto" aria-label="Prototype controls">
  <a href="index.html">All prototypes</a>
</div>

<script src="p3r-data.js"></script>
<script>
  const { PARENTS, RESULT, RULE, PERSONAS, TOTAL, strip, stripHead, skillList, wireSearch, wireToggles, moment } = P3R;
  const $ = (s) => document.querySelector(s);

  // Major arcana numbering, in P3R's own order (upstream comp-config races).
  const ORDER = ['Fool', 'Magician', 'Priestess', 'Empress', 'Emperor', 'Hierophant', 'Lovers', 'Chariot', 'Justice', 'Hermit', 'Fortune', 'Strength', 'Hanged', 'Death', 'Temperance', 'Devil', 'Tower', 'Star', 'Moon', 'Sun', 'Judgement', 'Aeon'];
  const roman = (n) => {
    if (!n) return '0';
    return [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']].reduce((s, [v, r]) => { while (n >= v) { s += r; n -= v; } return s; }, '');
  };
  const numeral = (arcana) => roman(ORDER.indexOf(arcana));

  const card = (p, { big, id } = {}) => `
    <div class="card${big ? ' card--big' : ''}" data-face="up">
      <div class="card__inner">
        <div class="card__face">
          <p class="card__no" aria-hidden="true">${numeral(p.arcana)}</p>
          <p class="card__arcana">The ${p.arcana}</p>
          <div class="card__art" aria-hidden="true">${p.name[0]}</div>
          <div class="card__banner">${big ? `<h2 id="${id}">${p.name}</h2>` : `<strong>${p.name}</strong>`}<span>Lv ${p.lv}</span></div>
        </div>
        <div class="card__back" aria-hidden="true"></div>
      </div>
    </div>`;
  const seat = (p, i) => `
    <div class="seat">
      ${card(p)}
      <div class="seat__slot">
        <label for="p${i}">Parent ${i + 1}</label>
        <input id="p${i}" value="${p.name}" autocomplete="off" spellcheck="false" />
      </div>
    </div>`;

  $('[data-total]').textContent = TOTAL;
  $('[data-spread]').innerHTML = `
    ${seat(PARENTS[0], 0)}
    <span class="op" aria-hidden="true">+</span>
    ${seat(PARENTS[1], 1)}
    <span class="op op--eq" aria-hidden="true">=</span>
    <section class="seat seat--result" aria-labelledby="r-name" aria-live="polite">
      ${card(RESULT, { big: true, id: 'r-name' })}
    </section>`;
  $('[data-rule]').innerHTML = `<b>The ${RULE.arcana[0]}</b> and <b>the ${RULE.arcana[1]}</b> make the ${RULE.makes}. The first ${RULE.makes} from Lv ${RULE.from} is ${RESULT.name}.`;

  $('[data-entry]').innerHTML = `
    ${PARENTS.map((p) => `
      <section aria-label="${p.name}">
        <h3>${p.name}</h3>
        <p class="meta">${p.arcana}, Lv <b>${p.lv}</b>, inherits <b>${p.inherits}</b></p>
        <ul class="skills">${skillList(p.skills)}</ul>
      </section>`).join('')}
    <section class="result-detail" aria-label="${RESULT.name} details">
      <div>
        <h3>${RESULT.name}</h3>
        <p class="meta">${RESULT.arcana}, Lv <b>${RESULT.lv}</b>, inherits <b>${RESULT.inherits}</b></p>
        <dl class="stats">${RESULT.stats.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
      </div>
      <div>
        <div class="aff">${strip(RESULT.aff, true)}</div>
        <p class="legend">Wk weak (gilt), Rs resist, Nu null (outlined)</p>
      </div>
      <ul class="skills">${skillList(RESULT.skills)}</ul>
    </section>`;

  $('[data-aff-head]').innerHTML = stripHead();
  const rows = $('[data-rows]');
  rows.innerHTML = PERSONAS.map((p) => `
    <tr tabindex="0">
      <td class="lv">${p.lv}</td>
      <td class="name">${p.name}${p.tag ? `<span class="tag">${p.tag.toLowerCase()}</span>` : ''}</td>
      <td class="arcana"><span class="no">${numeral(p.arcana)}</span>${p.arcana}</td>
      <td><div class="aff">${strip(p.aff)}</div></td>
    </tr>`).join('');
  wireSearch($('#q'), rows);
  wireToggles($('.modes'));

  /* Pointer: cards lean toward it and the sheen follows. */
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.card').forEach((c) => {
    if (still) return;
    c.addEventListener('pointermove', (e) => {
      const r = c.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      const y = (e.clientY - r.top) / r.height;
      c.style.setProperty('--ry', `${(x - 0.5) * 14}deg`);
      c.style.setProperty('--rx', `${(0.5 - y) * 10}deg`);
      c.style.setProperty('--mx', `${x * 100}%`);
      c.style.setProperty('--my', `${y * 100}%`);
    });
    c.addEventListener('pointerleave', () => { c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); });
  });

  /* ---- Signature: the result card is dealt face down and turns over. ---- */
  const big = $('.card--big');
  moment((at, end) => {
    big.dataset.face = 'down';
    at(500, () => { big.classList.add('is-flipping'); big.dataset.face = 'up'; });
    at(1600, end);
  }, () => { big.classList.remove('is-flipping'); big.dataset.face = 'up'; }).play();
</script>
</body>
</html>
