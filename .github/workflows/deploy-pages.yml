name: Deploy to GitHub Pages

# Publishes to https://megaten-companion.dinshub.com/ (custom domain, §14 Q5).
#
# NOT auto-enabled. To turn it on:
#   1. Repo Settings → Pages → Source = "GitHub Actions".
#   2. Settings → Pages → Custom domain = "megaten-companion.dinshub.com".
#   3. Run this workflow from the Actions tab (workflow_dispatch), or uncomment
#      the `push` trigger below to publish on every push to main.
# The custom domain serves from the site root, so base-href is "/" (a subpath
# like /megaten-companion/ would make the browser request assets from a path
# that 404s to the HTML fallback — MIME-type error). The app's data fetches are
# relative, so they resolve under root. index.html is copied to 404.html so
# client-side deep links resolve on Pages' static host; CNAME pins the domain
# so an Actions deploy can't reset it.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate committed datasets (§8.4)
        run: node scripts/validate-data.mjs
      # Inject the PrimeUI key from a repo secret so it never lives in this public
      # repo. Set it under Settings → Secrets and variables → Actions →
      # "PRIMEUI_LICENSE_KEY". Runs after `npm ci` (whose postinstall wrote the
      # empty template) and overwrites it. Without the secret, the build just keeps
      # the watermark. Note: a Community *dev* key may be scoped to localhost — you
      # may need a deploy/domain key for dinshub.github.io (Community tier covers
      # non-commercial open source).
      - name: Inject PrimeUI licence key (if set)
        env:
          PRIMEUI_LICENSE_KEY: ${{ secrets.PRIMEUI_LICENSE_KEY }}
        run: |
          if [ -n "$PRIMEUI_LICENSE_KEY" ]; then
            printf "export const PRIMEUI_LICENSE_KEY = '%s';\n" "$PRIMEUI_LICENSE_KEY" > src/environments/license.ts
            echo "Injected licence key from secret."
          else
            echo "No PRIMEUI_LICENSE_KEY secret — building with the empty template (watermark stays)."
          fi
      - name: Build
        run: npx ng build --configuration production --base-href /
      - name: SPA deep-link fallback + disable Jekyll
        run: |
          cp dist/megaten-companion/browser/index.html dist/megaten-companion/browser/404.html
          touch dist/megaten-companion/browser/.nojekyll
          echo 'megaten-companion.dinshub.com' > dist/megaten-companion/browser/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/megaten-companion/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
