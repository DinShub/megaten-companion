<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Demons · Guidebook · SMT Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="guidebook.css" />
<style>
  .tbl { min-width: 66rem; }
  .count-line { margin: 0; color: var(--ink-dim); font-size: var(--t-s); font-variant-numeric: tabular-nums; b { color: var(--ink); } }
  .species { margin-top: 1.2rem; }
</style>
</head>
<body data-section="demons">
<header class="desk" data-desk></header>
<div class="page">
  <nav><ol class="thumbs" data-thumbs></ol></nav>
  <main class="sheet">
    <div class="runhead">
      <div>
        <h1><span class="runhead__jp plate" lang="ja">悪魔一覧</span>Demons</h1>
        <ul class="chapters" aria-label="Demon pages">
          <li><a href="demons.html" aria-current="page">All demons</a></li>
          <li><a href="demon.html#shiva">Entry</a></li>
        </ul>
      </div>
      <p>Every demon, by race. Pick one to open its entry.</p>
    </div>

    <ul class="chips species" aria-label="Species" data-chips></ul>
    <div class="toolbar">
      <div class="field">
        <label for="q">Search</label>
        <input id="q" placeholder="Name, katakana, race or alignment" autocomplete="off" />
      </div>
      <p class="count-line" data-count aria-live="polite"></p>
    </div>

    <div class="tbl-scroll">
      <table class="tbl">
        <thead><tr><th>Lv</th><th>Name</th><th>Katakana</th><th>Race</th><th>Alignment</th><th><div class="aff aff--row" data-aff-head></div></th></tr></thead>
        <tbody data-rows></tbody>
      </table>
    </div>

    <p class="foot">252 demons from upstream's SMT1 demon-data.json, in upstream's species order (SNES-labelled data).</p>
  </main>
</div>

<div class="proto" aria-label="Prototype controls"><a href="index.html">Overview</a></div>

<script src="smt1-data.js"></script>
<script src="gb.js"></script>
<script>
  const { DEMONS, SPECIES, esc, strip, stripHead } = GB;
  const $ = (s) => document.querySelector(s);
  const titleCase = (s) => s[0] + s.slice(1).toLowerCase();

  $('[data-aff-head]').innerHTML = stripHead();
  const rows = $('[data-rows]');
  let html = '';
  let race = null;
  for (const d of DEMONS) {
    if (d.race !== race) {
      race = d.race;
      const n = DEMONS.filter((x) => x.race === race).length;
      html += `<tr class="group" data-race="${race}" data-species="${d.species}"><td colspan="6">${race}<small>${titleCase(d.species)}, ${n}</small></td></tr>`;
    }
    html += `<tr tabindex="0" data-id="${d.id}" data-race="${d.race}" data-species="${d.species}" data-text="${esc(`${d.name} ${d.jp} ${d.race} ${d.al.say}`.toLowerCase())}">
      <td class="num">${d.lv}</td>
      <td class="strong"><a href="demon.html#${d.id}" tabindex="-1">${esc(d.name)}</a>${d.special ? '<span class="tag">Special</span>' : ''}</td>
      <td class="jp" lang="ja">${d.jp}</td>
      <td class="dim">${d.race}</td>
      <td class="dim">${d.al.say}</td>
      <td><div class="aff aff--row">${strip(d.res)}</div></td>
    </tr>`;
  }
  rows.innerHTML = html;
  rows.addEventListener('click', (e) => { const tr = e.target.closest('tr[data-id]'); if (tr) location.href = `demon.html#${tr.dataset.id}`; });
  rows.addEventListener('keydown', (e) => { const tr = e.target.closest('tr[data-id]'); if (tr && e.key === 'Enter') location.href = `demon.html#${tr.dataset.id}`; });

  /* Species chips + search, together. */
  const chips = $('[data-chips]');
  chips.innerHTML = `<li><button type="button" class="chip" aria-pressed="true" data-sp="">All<small>${DEMONS.length}</small></button></li>` +
    SPECIES.map(([sp]) => `<li><button type="button" class="chip" aria-pressed="false" data-sp="${sp}">${titleCase(sp)}<small>${DEMONS.filter((d) => d.species === sp).length}</small></button></li>`).join('');
  let sp = '';
  function apply() {
    const t = $('#q').value.trim().toLowerCase();
    let shown = 0;
    const racesShown = new Set();
    rows.querySelectorAll('tr[data-id]').forEach((tr) => {
      const ok = (!sp || tr.dataset.species === sp) && (!t || tr.dataset.text.includes(t));
      tr.hidden = !ok;
      if (ok) { shown++; racesShown.add(tr.dataset.race); }
    });
    rows.querySelectorAll('tr.group').forEach((tr) => { tr.hidden = !racesShown.has(tr.dataset.race); });
    $('[data-count]').innerHTML = `<b>${shown}</b> of ${DEMONS.length}`;
  }
  chips.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    sp = b.dataset.sp;
    chips.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    apply();
  });
  $('#q').addEventListener('input', apply);
  apply();

  GB.boot();
</script>
</body>
</html>
