<!doctype html>
<!-- `app-dark` matches darkModeSelector in app.config.ts; set here so the first
     paint is already dark. Don't add an inline color-scheme — it would outrank
     the theme's own rule and pin the page to dark. -->
<html lang="en" class="app-dark">
  <head>
    <meta charset="utf-8" />
    <title>Megaten Companion</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#18181b" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
